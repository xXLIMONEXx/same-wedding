  /* ---------- 结尾页 ---------- */
  .endpage{

<script>
/* =====================================================
   SVG 场景绘制
===================================================== */
function fig(x,y,h,shirt,skin,dress){
  skin=skin||'#f0c29a';var w=h*0.34;var s='';
  s+='<circle cx="'+x+'" cy="'+(y-h)+'" r="'+(h*0.115)+'" fill="'+skin+'"/>';
  if(dress){
    s+='<path d="M '+(x-w*0.75)+' '+y+' L '+(x+w*0.75)+' '+y+' L '+(x+w*0.32)+' '+(y-h*0.42)+' L '+(x-w*0.32)+' '+(y-h*0.42)+' Z" fill="'+shirt+'"/>';
    s+='<rect x="'+(x-w*0.34)+'" y="'+(y-h*0.52)+'" width="'+(w*0.68)+'" height="'+(h*0.14)+'" rx="4" fill="'+shirt+'"/>';
  }else{
    s+='<rect x="'+(x-w/2)+'" y="'+(y-h*0.47)+'" width="'+w+'" height="'+(h*0.47)+'" rx="'+(w/2.4)+'" fill="'+shirt+'"/>';
    s+='<rect x="'+(x-w*0.34)+'" y="'+(y-h*0.05)+'" width="'+(w*0.26)+'" height="'+(h*0.06)+'" fill="#2c313c"/>';
    s+='<rect x="'+(x+w*0.08)+'" y="'+(y-h*0.05)+'" width="'+(w*0.26)+'" height="'+(h*0.06)+'" fill="#2c313c"/>';
  }
  return s;
}
function faceOn(x,y,r,exp){
  var b='stroke="#3a2c20" stroke-width="'+(r*0.1).toFixed(1)+'" stroke-linecap="round" fill="none"';
  var s='<circle cx="'+(x-r*0.36)+'" cy="'+(y+r*0.02)+'" r="'+(r*0.13)+'" fill="#2c2420"/>';
  s+='<circle cx="'+(x+r*0.36)+'" cy="'+(y+r*0.02)+'" r="'+(r*0.13)+'" fill="#2c2420"/>';
  if(exp==='angry'){
    s+='<path d="M '+(x-r*0.62)+' '+(y-r*0.44)+' L '+(x-r*0.12)+' '+(y-r*0.26)+'" '+b+'/>';
    s+='<path d="M '+(x+r*0.62)+' '+(y-r*0.44)+' L '+(x+r*0.12)+' '+(y-r*0.26)+'" '+b+'/>';
    s+='<path d="M '+(x-r*0.4)+' '+(y+r*0.52)+' L '+(x+r*0.4)+' '+(y+r*0.52)+'" '+b+'/>';
  }else if(exp==='sad'){
    s+='<path d="M '+(x-r*0.62)+' '+(y-r*0.26)+' L '+(x-r*0.12)+' '+(y-r*0.44)+'" '+b+'/>';
    s+='<path d="M '+(x+r*0.62)+' '+(y-r*0.26)+' L '+(x+r*0.12)+' '+(y-r*0.44)+'" '+b+'/>';
    s+='<path d="M '+(x-r*0.36)+' '+(y+r*0.58)+' Q '+x+' '+(y+r*0.36)+' '+(x+r*0.36)+' '+(y+r*0.58)+'" '+b+'/>';
  }else{
    s+='<path d="M '+(x-r*0.5)+' '+(y-r*0.34)+' L '+(x-r*0.1)+' '+(y-r*0.4)+'" '+b+'/>';
    s+='<path d="M '+(x+r*0.5)+' '+(y-r*0.34)+' L '+(x+r*0.1)+' '+(y-r*0.4)+'" '+b+'/>';
    s+='<path d="M '+(x-r*0.3)+' '+(y+r*0.46)+' Q '+x+' '+(y+r*0.6)+' '+(x+r*0.3)+' '+(y+r*0.46)+'" '+b+'/>';
  }
  return s;
}
function hairTop(x,y,r,color){
  return '<path d="M '+(x-r)+' '+(y-r*0.15)+' Q '+(x-r*0.7)+' '+(y-r*1.15)+' '+x+' '+(y-r*1.05)+' Q '+(x+r*0.7)+' '+(y-r*1.15)+' '+(x+r)+' '+(y-r*0.15)+' Q '+(x+r*0.55)+' '+(y-r*0.62)+' '+x+' '+(y-r*0.58)+' Q '+(x-r*0.55)+' '+(y-r*0.62)+' '+(x-r)+' '+(y-r*0.15)+' Z" fill="'+color+'"/>';
}
function chair(x,y,s){
  return '<g transform="translate('+x+','+y+') scale('+s+')">'
    +'<rect x="0" y="-15" width="26" height="7" rx="2" fill="#fdfaf2" stroke="#cfc7b4" stroke-width=".8"/>'
    +'<rect x="0" y="0" width="26" height="9" rx="2" fill="#fff" stroke="#cfc7b4" stroke-width=".8"/>'
    +'<rect x="2" y="-8" width="2.5" height="8" fill="#ddd5c2"/><rect x="21.5" y="-8" width="2.5" height="8" fill="#ddd5c2"/></g>';
}
function arch(x,y,s){
  return '<g transform="translate('+x+','+y+') scale('+s+')">'
    +'<rect x="-36" y="-64" width="7" height="66" rx="3" fill="#fdfaf2"/>'
    +'<rect x="29" y="-64" width="7" height="66" rx="3" fill="#fdfaf2"/>'
    +'<path d="M -36 -58 Q -3.5 -92 36 -58" fill="none" stroke="#fdfaf2" stroke-width="7" stroke-linecap="round"/>'
    +'<circle cx="-33" cy="-64" r="5" fill="#ef8ba0"/><circle cx="-14" cy="-80" r="5" fill="#e4607e"/><circle cx="8" cy="-85" r="5" fill="#f2a6b8"/><circle cx="30" cy="-70" r="5" fill="#e4607e"/><circle cx="0" cy="-84" r="4.4" fill="#fff"/></g>';
}
function sun(x,y,r,warm){
  return '<circle cx="'+x+'" cy="'+y+'" r="'+(r*2.1)+'" fill="url(#sunGlow)"/>'
    +'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+(warm||'#ffd76e')+'"/>';
}
function treeL(x,y,s){
  return '<g transform="translate('+x+','+y+') scale('+s+')">'
    +'<rect x="-6" y="-70" width="12" height="74" rx="4" fill="#7a5a3a"/>'
    +'<circle cx="0" cy="-95" r="52" fill="#5f9e46"/><circle cx="-38" cy="-72" r="34" fill="#6fae4e"/><circle cx="36" cy="-76" r="36" fill="#54903e"/></g>';
}
function defs(){
  return '<defs>'

/* =====================================================
   播放引擎
===================================================== */
var stage=document.getElementById('stage');
var chip=document.getElementById('viewChip');
var bar=document.getElementById('bar');
var pauseBtn=document.getElementById('pauseBtn');
var hint=document.getElementById('hint');
var idx=-1,playing=true,remain=0,lastT=0,started=false;

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}

function show(i){
  idx=i;var sc=scenes[i];
  stage.innerHTML='';
  stage.classList.remove('fainting','shake');

  if(sc.special==='question'){renderQuestion();updateHUD(sc);return;}
  if(sc.special==='knowledge'){renderKnowledge();updateHUD(sc);return;}

  var scene=el('div','scene');
  if(sc.st)scene.classList.add('st'+sc.st);
  if(sc.gray)scene.classList.add('gray');
  if(sc.grayAfter)setTimeout(function(){scene.classList.add('gray');},sc.grayAfter*1000);
  if(sc.cool)scene.classList.add('cool');
  if(sc.dim)scene.classList.add('dim');
  if(sc.v==='none'&&!sc.cool&&!sc.gray)scene.classList.add('');
  if(sc.svg)scene.innerHTML=sc.svg();
  stage.appendChild(scene);

  if(sc.ov)scene.appendChild(el('div','ov '+sc.ov));
  if(sc.v==='none'&&sc.black!==undefined&&!sc.cool&&!sc.gray){
    scene.appendChild(el('div','ov',''));
    scene.style.background='#000';
  }
  /* 黑场淡入淡出转场 */
  if(sc.black!==undefined){
    scene.style.background='#000';
  }

  /* 文本层 */
  if(sc.cap)scene.appendChild(el('div','caption',sc.cap));
  if(sc.echo){
    scene.appendChild(el('div','textbox','<div class="mono echo">'+sc.echo+'</div>'));
  }else if(sc.mono){
    var cls='mono'+(sc.tremble?' tremble':'')+(sc.fading?' fading':'')+((sc.cool||sc.gray)?'':'');
    var tb=el('div','textbox','<div class="'+cls+'">'+sc.mono+'</div>'+(sc.phys?'<div class="phys">'+sc.phys+'</div>':''));
    scene.appendChild(tb);
  }
  if(sc.bubbles){
    sc.bubbles.forEach(function(b){
      var d=el('div','bubble '+b.cls,(b.who?'<span class="who">'+b.who+'</span>':'')+b.t);
      d.style.left=b.x;d.style.top=b.y;
      if(b.d)d.style.animationDelay=b.d+'s';
      scene.appendChild(d);
    });
  }
  if(sc.echo2){
    var e2=el('div','textbox','<div class="mono echo" style="bottom:26%;font-size:15px;opacity:.8;animation-delay:2s">'+sc.echo2+'</div>');
    e2.style.bottom='26%';e2.style.animationDelay='2s';
    scene.appendChild(e2);
  }
  if(sc.black!==undefined||sc.v==='none'&&(sc.black!==undefined)){
    scene.appendChild(el('div','blackcover'));
  }

  requestAnimationFrame(function(){requestAnimationFrame(function(){scene.classList.add('on');});});

  if(sc.faint){
    setTimeout(function(){stage.classList.add('fainting');
      var bc=el('div','blackcover');bc.style.transition='opacity 1s ease';bc.style.opacity='0';
      stage.appendChild(bc);
      setTimeout(function(){bc.style.opacity='1';},1400);
    },2600);
  }
  if(sc.shake)stage.classList.add('shake');

  /* 患者苏醒：从模糊到清晰 */
  if(sc.wake){
    scene.style.filter='blur(14px) brightness(1.3)';
    scene.style.transition='filter 3.5s ease';
    setTimeout(function(){scene.style.filter='blur(0) brightness(1)';},120);
  }

  remain=sc.dur*1000;
  updateHUD(sc);
}
function updateHUD(sc){
  var pct=Math.round(idx/(scenes.length-1)*100);
  bar.style.width=pct+'%';
  if(sc.v==='patient'){chip.textContent='患者视角';chip.classList.add('patient');}
  else if(sc.v==='normal'){chip.textContent='普通视角';chip.classList.remove('patient');}
  else if(sc.black!==undefined){chip.textContent='';}
  else{chip.textContent='';}
  hint.style.display=(sc.dur===0)?'none':'block';
}
function next(){
  if(idx>=scenes.length-1)return;
  show(idx+1);
}
function restart(){
  show(0);
}

/* 结尾问题页 */
function renderQuestion(){
  stage.innerHTML='';
  var p=el('div','endpage',
    '<div class="big">同一个选择</div>'
    +'<div class="contrast">在患者眼中，是<em>爱与渴望</em>；<br>在旁人眼中，是<em>自私与破坏</em>。</div>'
    +'<div class="q">谁才是对的？</div>'
    +'<div class="btnrow"><button class="endbtn" id="learnBtn">了解 EPP</button>'
    +'<button class="endbtn" id="againBtn">重新体验</button></div>');
  stage.appendChild(p);
  requestAnimationFrame(function(){p.style.opacity='1';});
  document.getElementById('learnBtn').onclick=function(e){e.stopPropagation();show(scenes.length-1);};
  document.getElementById('againBtn').onclick=function(e){e.stopPropagation();restart();};
}
/* 知识页 */
function renderKnowledge(){
  stage.innerHTML='';
  var p=el('div','know',
   '<div class="inner">'
   +'<h2>了解 EPP</h2><div class="en">Erythropoietic Protoporphyria · 红细胞生成性原卟啉症</div>'
   +'<h3>什么是 EPP？</h3>'
   +'<p>EPP 是一种罕见的遗传性代谢疾病。患者体内缺乏一种关键的酶，导致原卟啉在血液和皮肤中积累。当原卟啉暴露在可见光下时，会引发连锁化学反应，损伤周围组织——表现为剧烈的灼烧型疼痛。</p>'
   +'<h3>主要症状</h3>'
   +'<ul><li>即使短暂暴露在阳光下（几分钟到几十分钟），暴露的皮肤就会出现剧烈疼痛和灼烧感</li>'
   +'<li>皮肤红肿、水肿</li>'
   +'<li>反复的光敏反应会导致皮肤增厚、出现瘢痕，看起来像"皮革"</li>'
   +'<li>长期严格避光导致维生素 D 严重缺乏，引发骨质疏松、骨折风险增加</li></ul>'
   +'<h3>患者的日常挑战</h3>'
   +'<ul><li>必须全年严格防晒：长袖、手套、帽子、防晒霜</li>'
   +'<li>即使在室内，窗户透进的阳光也可能引发症状</li>'
   +'<li>因为长期遮盖和外观改变，容易陷入社交孤立</li>'
   +'<li>需要终身补充维生素 D</li></ul>'
   +'<div class="note">重要提示：这个故事基于真实的医学事实和患者经历，但具体情节为艺术创作。每位 EPP 患者的症状严重程度不同。疼痛是真实的，即使它从外表看不见。</div>'
   +'<div class="src">主要信息来源：<br>· 《Journal of Clinical Endocrinology &amp; Metabolism》EPP 患者骨密度研究（2025）<br>· 诺华公司 EPP 患者自述《No longer living in fear》<br>· 罕见病相关医学文献与患者组织公开资料</div>'
   +'<div class="btnrow"><button class="endbtn" id="backBtn">返回结尾</button>'
   +'<button class="endbtn" id="restartBtn2">重新体验</button></div>'
   +'</div>');
  stage.appendChild(p);
  document.getElementById('backBtn').onclick=function(e){e.stopPropagation();show(scenes.length-2);};
  document.getElementById('restartBtn2').onclick=function(e){e.stopPropagation();restart();};
}

/* 交互 */
stage.addEventListener('click',function(e){
  if(e.target.closest('.endbtn'))return;
  if(idx>=0&&scenes[idx].dur===0)return;
  next();
});
document.addEventListener('keydown',function(e){
  if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();next();}
  if(e.key==='p'||e.key==='P')togglePause();
});
function togglePause(){
  playing=!playing;
  pauseBtn.textContent=playing?'暂停':'播放';
}
pauseBtn.addEventListener('click',function(e){e.stopPropagation();togglePause();});
document.getElementById('startBtn').addEventListener('click',function(){
  document.getElementById('intro').classList.add('hidden');
  started=true;show(0);
});

/* 主循环 */
function loop(t){
  if(lastT===0)lastT=t;
  var dt=t-lastT;lastT=t;
  if(started&&playing&&idx>=0&&remain>0){
    remain-=dt;
    if(remain<=0)next();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
